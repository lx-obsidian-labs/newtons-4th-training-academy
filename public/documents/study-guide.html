<!doctype html><html lang="en-ZA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Course-specific introductory student handbooks and revision worksheets."><title>Student handbook | Newton's 4th Training Academy</title><style>:root{--navy:#172433;--gold:#ffc52a}*{box-sizing:border-box}body{margin:0;background:#e9eef2;color:#233244;font:15px/1.65 Arial,sans-serif}.toolbar{background:#101b28;color:white;display:flex;justify-content:space-between;align-items:center;gap:15px;padding:12px 5%;position:sticky;top:0;z-index:5}.toolbar button{background:var(--gold);border:0;border-radius:6px;padding:12px 17px;font-weight:800;cursor:pointer}.book{max-width:900px;margin:24px auto;background:#fff;box-shadow:0 14px 45px #101b2820}.page{min-height:950px;padding:60px 65px;border-bottom:1px solid #e0e6ec;break-after:page}.cover{background:linear-gradient(135deg,#111c2b,#304a61);color:#fff;display:flex;flex-direction:column;justify-content:space-between}.brand{font-weight:900;letter-spacing:2px}.brand span{color:var(--gold)}.kicker{font-size:12px;font-weight:800;letter-spacing:2px;color:#966c00;text-transform:uppercase}.cover .kicker{color:var(--gold)}h1{font-size:clamp(48px,7vw,78px);line-height:1.06;margin:20px 0}h2{font-size:36px;line-height:1.15;color:var(--navy);margin:15px 0 22px}h3{font-size:20px;color:var(--navy);margin:22px 0 8px}.cover h1 em{color:var(--gold);font-style:normal}.lead{font-size:19px}.cover .shape{height:200px;border:3px solid #ffffff45;background:repeating-linear-gradient(135deg,#ffffff08 0 15px,#ffc52a18 15px 30px);display:flex;align-items:center;justify-content:center}.cover .shape svg{width:80%;max-width:400px}.tag{display:inline-block;background:#ffc52a;color:#172433;padding:8px 13px;font-weight:800;font-size:12px}.notice{background:#fff7df;border-left:5px solid var(--gold);padding:17px 20px;margin:20px 0}.columns{display:grid;grid-template-columns:1fr 1fr;gap:25px}.panel{background:#f0f4f6;padding:20px;border-top:4px solid var(--gold)}li{margin:9px 0}.answer{min-height:105px;border:1px solid #d4dce2;border-radius:5px;margin:12px 0;padding:12px}.line{border-bottom:1px solid #d7e0e6;min-height:36px}.small{font-size:12px;color:#647080}.footer{border-top:1px solid #d7dfe5;padding-top:15px;margin-top:35px;font-size:12px;color:#657281}.diagram{width:100%;height:auto;margin:12px 0}a{color:#172433}@media(max-width:650px){.page{padding:30px 22px;min-height:0}.columns{grid-template-columns:1fr}.book{margin:0}.toolbar{font-size:12px}h2{font-size:30px}}@media print{@page{size:A4;margin:0}body{background:white;-webkit-print-color-adjust:exact;print-color-adjust:exact}.toolbar{display:none}.book{max-width:none;margin:0;box-shadow:none}.page{height:297mm;min-height:0;padding:18mm;overflow:hidden;break-after:page;page-break-after:always}.page:last-child{break-after:auto;page-break-after:auto}.cover .shape{height:62mm}}</style></head><body><div class="toolbar"><span>Newton's 4th • Student handbook</span><button onclick="window.print()">Print / Save PDF booklet</button></div><div class="book" id="book"></div><script>const data={"specific":{"Excavator":["Boom, stick, bucket, cab, tracks and hydraulic system","Ground stability, buried services, swing radius and nearby workers","Identify major components on a labelled diagram; explain the role of a banksman"],"TLB":["Loader bucket, backhoe boom, outriggers, tyres and hydraulic controls","Stability, underground services, pedestrian separation and reversing","Compare front-loader and backhoe functions; explain stabiliser purpose"],"Dump truck":["Body, tipping mechanism, tyres, braking system and mirrors","Overhead obstructions, uneven tipping surfaces and blind spots","Describe a safe haul-route briefing and defect reporting"],"Rigid dump truck":["Haul body, suspension, braking and retarder systems","Grades, heavy loads, visibility and haul-road intersections","Explain why manufacturer payload ratings and haul-road rules matter"],"Bulldozer":["Blade, tracks, ripper and operator protection","Slope stability, buried services and restricted visibility","Explain how terrain and ground conditions affect risk"],"Front-end loader":["Loader arms, bucket, articulation joint and tyres","Tipping risk, load visibility and people near the machine","Identify loading-zone hazards and safe communication principles"],"Grader":["Mouldboard, articulation, tyres and scarifier","Road edges, visibility, traffic interfaces and changing gradients","Explain why traffic management and ground assessment are required"],"Bobcat":["Skid-steer controls, lift arms, attachments and restraint systems","Crush points, attachment changes and rollover hazards","Identify attachment compatibility and exclusion-zone questions"],"Forklift":["Mast, forks, load backrest, counterweight and data plate","Unstable loads, pedestrians, blind corners and ramps","Explain the importance of the load chart and daily inspection"],"Drill rig":["Mast, drill string, feed mechanism and dust suppression","Moving rods, unstable ground, dust and stored energy","Identify dust-control and isolation questions"],"LHD scoop":["Bucket, articulation, operator compartment and braking systems","Confined mine headings, ventilation and poor visibility","Describe mine traffic separation and communication needs"],"Mobile crane":["Boom, outriggers, hook block and load chart","Ground bearing capacity, overhead lines and suspended loads","Interpret why a lift plan and competent rigging team are necessary"],"Tower crane":["Jib, counter-jib, hook, trolley and slew system","Wind, falling objects, communication and suspended loads","Identify site-specific lifting-plan requirements"],"Overhead crane":["Bridge, trolley, hoist, hook and pendant controls","Dropped loads, pinch points and exclusion zones","Explain pre-use inspection and signalling responsibilities"],"Welding and fabrication":["Welding process types, joints, drawings and PPE","Arc radiation, fumes, fire and electric shock","Identify ventilation and hot-work permit requirements"],"Electrical":["Circuits, isolation, earthing and test instruments","Electric shock, arc flash and unexpected energisation","Explain why isolation and competent testing are essential"],"Motor mechanics":["Engine systems, brakes, steering and diagnostic tools","Moving parts, lifting vehicles and hazardous fluids","Describe safe vehicle support and defect recording"],"First aid":["Primary survey, emergency response and reporting","Scene hazards, infection exposure and delayed emergency assistance","Outline the need to call emergency services and follow current accredited training"],"Firefighting":["Fire triangle, alarm systems and evacuation routes","Smoke, heat, toxic gases and unsafe re-entry","Explain evacuation priorities and when not to attempt firefighting"],"Business management":["Planning, operations, budgeting and customer value","Financial errors, weak controls and poor communication","Prepare a simple business process map"],"Information and communication technology":["Hardware, networks, cybersecurity and digital records","Phishing, data loss and privacy breaches","Create a password and backup awareness checklist"]},"cats":{"Earthmoving":["Site induction and ground assessment","Machine components and identification","Pre-use visual inspection concepts","Pedestrian separation and communication","Environmental awareness and shutdown reporting"],"Mining":["Mine induction and risk controls","Equipment components","Ventilation and dust awareness","Traffic management and exclusion zones","Emergency communication and reporting"],"Lifting":["Lifting equipment identification","Rated capacity and load stability","Signalling and pedestrian separation","Inspection and defect reporting","Lift planning and emergency controls"],"Artisan trades":["Tools and workshop terminology","Technical drawings and measurements","Materials and quality assurance","Workshop PPE and housekeeping","Defect reporting and practical supervision"],"Safety":["Hazard identification and risk assessment","Hierarchy of controls","Incident and near-miss reporting","Emergency response responsibilities","Safety documentation and communication"],"Business & ICT":["Professional communication","Workplace systems and records","Ethical and responsible practice","Quality assurance and problem-solving","Data security and continuous improvement"]}};const p=new URLSearchParams(location.search),course=(p.get('course')||'Course').slice(0,90),cat=(p.get('category')||'Earthmoving').slice(0,70);const topics=data.cats[cat]||data.cats.Earthmoving;const detail=data.specific[course]||[topics[1],topics[2], 'Explain key workplace concepts and discuss a supervised practical example with your instructor'];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const list=a=>'<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';const page=(k,title,body)=>'<section class="page"><div class="kicker">'+k+'</div><h2>'+title+'</h2>'+body+'<div class="footer">Newton\'s 4th Training Academy • Student learning support • '+esc(course)+'</div></section>';const flow=(a,b,c,d)=>'<svg class="diagram" viewBox="0 0 720 125" role="img" aria-label="Four-step learning illustration"><rect width="720" height="125" rx="12" fill="#eff3f6"/>'+[a,b,c,d].map((x,i)=>'<rect x="'+(16+i*179)+'" y="27" width="148" height="68" rx="9" fill="'+(i%2?'#ffc52a':'#172433')+'"/><text x="'+(90+i*179)+'" y="65" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="12" font-weight="bold" fill="'+(i%2?'#172433':'white')+'">'+esc(x)+'</text>').join('')+'</svg>';const pedagogy={"tailored":{"Excavator":["An excavator combines an upper rotating structure with a tracked or wheeled undercarriage. The boom raises the working equipment, the stick positions the bucket, and the bucket interacts with material. Hydraulic systems transmit force through pressurised fluid.","Compare boom, stick and bucket functions using a labelled OEM illustration.","A trench is planned near an unmarked underground service. Why must the task wait for site clearance?","Because underground services and ground stability must be assessed before any excavation."],"TLB":["A tractor-loader-backhoe combines a front loading attachment with a rear digging attachment. The two ends serve different functions and require different working-space considerations.","Sketch the front loader and rear backhoe and label their purposes.","Why is an apparently level surface not automatically safe for digging?","Underground services, ground bearing and surrounding activity may still create hazards."],"Forklift":["A forklift carries loads on forks mounted to a mast. Stability depends on the combined centre of gravity of truck and load, load position and the equipment's rated capacity.","Identify the mast, forks, counterweight and capacity plate from an approved diagram.","A load obscures the operator's view. What should be checked before moving?","The approved site traffic plan, visibility arrangements and supervisor instructions."],"Mobile crane":["A mobile crane uses a boom and hoisting system to lift loads. Capacity depends on configuration, radius, ground support and manufacturer specifications; one nominal capacity is not valid for every lift.","Discuss how lifting radius and ground conditions affect planning without calculating an actual lift.","Why is a lift plan necessary even when a load appears light?","Configuration, rigging, ground conditions, nearby hazards and communication all matter."],"Tower crane":["A tower crane has a vertical tower, jib, counter-jib, trolley and hoisting system. Its work is coordinated through approved lifting plans and trained signalling personnel.","Identify the jib, counter-jib, hook and trolley on a reference drawing.","Why is weather information important before a planned lift?","Wind and visibility can affect the safety of lifting operations; approved limits govern decisions."],"Overhead crane":["An overhead crane moves along a runway while a trolley and hoist position the load. Safe lifting relies on suitable rigging, rated components and clear communication.","Draw the relationship between bridge, trolley, hoist and load.","Why must nobody stand under a suspended load?","A falling or shifting load can cause severe injury."],"Welding and fabrication":["Welding joins materials using heat, pressure or both. Joint preparation, material selection and process choice affect weld quality. Arc radiation, fumes and fire are major hazards.","Compare a butt joint and a fillet joint using instructor-approved illustrations.","Why should welding fumes and nearby combustible materials be assessed?","Fume exposure and ignition risk require appropriate controls and supervision."],"Electrical":["Electrical circuits require a complete path for current. Voltage, current and resistance describe different properties. Electrical energy remains hazardous even when equipment appears switched off.","Use a classroom circuit diagram to identify a source, conductor, load and protective device.","Why is switching off a control not equivalent to verified isolation?","Other energy sources or incorrect isolation may leave conductors energised."],"First aid":["First aid is immediate assistance while professional help is arranged. Learners must prioritise scene safety, call emergency services and work only within current training and competence.","Role-play reporting an emergency location and the number of people involved.","Why must a responder check for danger before approaching?","An unsafe scene can create additional casualties."],"Firefighting":["Fire needs fuel, heat and an oxidiser. Prevention focuses on reducing ignition sources and controlling combustibles. Evacuation and alarm procedures take priority over attempting to fight a fire.","Draw the fire triangle and identify examples from a workshop.","Why should a person not enter a smoke-filled room to investigate?","Smoke and toxic gases can incapacitate rapidly; emergency procedures apply."],"Business management":["A business converts resources into products or services that create customer value. Planning, operations, cash flow and feedback influence sustainability.","Draw a simple input–process–output diagram for a small local business.","Why can a profitable business still face cash-flow difficulties?","Income and expenditure may occur at different times."],"Information and communication technology":["ICT systems combine hardware, software, networks, data and people. Confidentiality, integrity and availability are central information-security principles.","Classify common office devices as input, output, storage or network equipment.","Why are backups and access controls both important?","Backups support recovery; access controls reduce unauthorised use."],"Drill rig":["Drill rigs create boreholes for applications such as exploration or production. Their systems can include a mast, drilling assembly, feed mechanism and dust controls.","Label a rig's mast and drilling assembly using approved course imagery.","Why are rotating parts and dust treated as separate hazards?","They create different mechanical and exposure risks requiring different controls."],"LHD scoop":["Load-haul-dump machines move material in underground workings. Restricted clearances, ventilation and traffic coordination are key operational considerations.","Sketch a simplified underground traffic route and identify pedestrian separation points.","Why does reduced visibility change communication requirements?","Workers and machines may not see each other; site traffic controls are essential."],"Grader":["A grader uses an adjustable mouldboard to shape surfaces. The work affects drainage, road profile and safe access for other vehicles.","Explain the difference between surface shaping and material loading.","Why must nearby traffic be managed during road maintenance?","Road users and moving equipment can enter the same work area."],"Bulldozer":["A bulldozer pushes and spreads material using a blade; some configurations include a ripper. Tracks distribute machine weight across the ground.","Compare the role of a bulldozer blade and an excavator bucket.","Why does a slope require a specific risk assessment?","Slope stability and equipment limits vary by terrain and configuration."],"Front-end loader":["A front-end loader lifts and carries loose material using a front-mounted bucket. Articulated machines bend at a central joint to steer.","Label bucket, loader arms and articulation joint.","Why should a loader work zone be separated from pedestrians?","Blind spots and moving equipment create collision and crush hazards."],"Dump truck":["A dump truck transports and tips loose material. Safe tipping requires assessment of surface conditions, overhead obstructions and exclusion zones.","Describe why a raised body changes the machine's risk profile.","Why is uneven ground especially concerning during tipping?","A raised body can affect stability and increase overturning risk."],"Rigid dump truck":["Rigid dump trucks are designed for heavy hauling on suitable routes. Their size, stopping distance and restricted visibility require dedicated traffic controls.","Compare a haul road and a public road in terms of site rules.","Why are vehicle routes and gradients assessed before use?","Heavy vehicles need suitable road conditions and controlled interactions."],"Bobcat":["A skid-steer loader turns by varying wheel or track movement on each side. Attachments change its applications and hazards.","Explain why a compatible attachment must be verified for the machine.","Why should the operator restraint system never be bypassed?","It is part of the machine's designed protection system."]},"defaults":{"Artisan trades":["Trade skills combine materials knowledge, measurement, drawings and quality checks. Correct tool selection and supervised practice reduce defects and injuries.","Draw a tool-to-task matching chart for your chosen trade.","Why is measurement important before cutting or assembly?","Poor measurement can waste material and compromise fit or quality."],"Safety":["Safety management uses hazard identification, risk assessment, control measures and review. The hierarchy of controls prioritises eliminating hazards before relying on PPE.","Apply the hierarchy of controls to one classroom example.","Why is PPE not usually the first preferred control?","It does not remove the underlying hazard."],"Mining":["Mining work combines complex equipment with confined or changing environments. Site induction, ventilation, traffic control and emergency readiness are critical.","Identify three mine-site hazards from an approved case study.","Why must mine-specific procedures be followed?","Conditions and controls differ between sites and tasks."],"Earthmoving":["Earthmoving equipment changes terrain and moves materials. Ground conditions, underground services, people and equipment interactions determine major hazards.","Compare the purpose of two machines in the course catalogue.","Why is a site-specific risk assessment needed?","Hazards vary with terrain, nearby infrastructure and the work plan."],"Lifting":["Lifting equipment must be selected and used within verified ratings. Rigging, ground support, communication and exclusion zones are integral to planning.","Identify the roles of a lifting supervisor and signal person.","Why is a visible rated-capacity marking important?","Equipment limits must be known and respected under the actual configuration."],"Business & ICT":["Workplace digital and business systems rely on accurate records, effective communication and responsible decisions.","Map an information flow from customer enquiry to completed service.","Why are accurate records important?","They support accountability, service quality and decision-making."]}};const lesson=pedagogy.tailored[course]||pedagogy.defaults[cat]||pedagogy.defaults['Artisan trades'];document.title=course+' | Student handbook';document.getElementById('book').innerHTML='<section class="page cover"><div><div class="brand">NEWTON\'S <span>4TH</span> TRAINING ACADEMY</div><p class="kicker">STUDENT HANDBOOK / INTRODUCTORY EDITION</p><h1>'+esc(course)+'<br><em>Study handbook</em></h1><p class="lead">'+esc(cat)+' • Theory, workplace awareness, revision and learning records</p></div><div class="shape"><svg viewBox="0 0 420 180" aria-label="Illustrated study pathway" role="img"><rect x="20" y="45" width="105" height="90" rx="8" fill="#ffc52a"/><path d="M40 65h65M40 85h65M40 105h40" stroke="#172433" stroke-width="7" stroke-linecap="round"/><path d="M140 90h80m-15-15 15 15-15 15" stroke="#ffc52a" stroke-width="7" fill="none"/><rect x="238" y="45" width="155" height="90" rx="8" fill="#ffffff25" stroke="#ffc52a" stroke-width="4"/><path d="M263 90l25 25 50-55" stroke="#ffc52a" stroke-width="10" fill="none"/></svg></div><div><span class="tag">SUPPLEMENTARY LEARNING RESOURCE</span><p>Prepared for independent study and instructor-led discussion. Not an equipment operating manual or accredited course textbook.</p></div></section>'+page('01 / INTRODUCTION','Your learning journey','<p class="lead">This handbook supports introductory learning for <strong>'+esc(course)+'</strong> in '+esc(cat)+'.</p><div class="notice"><strong>Safety and status:</strong> This is a supplementary learning resource. It does not authorise machine operation, electrical work, medical intervention, lifting, firefighting or any other hazardous activity. Follow the current approved curriculum, applicable law, manufacturer instructions and qualified supervision.</div><h3>Learning outcomes</h3>'+list(['Explain the purpose of the course and key terminology','Identify components, tools or processes relevant to the course','Recognise common hazards and workplace controls','Understand why inspections and defect reporting matter','Prepare questions for practical instruction and formal assessment'])+'<h3>How to use this booklet</h3><p>Read each section, write your own notes, discuss uncertainties with an instructor and complete the revision activities. Confirm the official course requirements and assessment standard with admissions.</p>')+page('02 / KNOWLEDGE','Core course concepts','<div class="columns"><div class="panel"><h3>Technical focus</h3><p>'+esc(detail[0])+'.</p><h3>Topics to discuss</h3>'+list(topics)+'</div><div><h3>Vocabulary notebook</h3><p>Define these terms using your instructor\'s approved learning materials.</p>'+topics.map(t=>'<p><strong>'+esc(t)+'</strong></p><div class="line"></div>').join('')+'</div></div>')+page('03 / SAFETY','Hazards and responsible practice','<h3>Course-specific hazard awareness</h3><p>'+esc(detail[1])+'.</p><h3>General safety principles</h3>'+list(['Attend site induction and follow relevant risk assessments','Use required PPE and comply with exclusion zones','Do not operate equipment or perform tasks without training and authorisation','Never bypass safeguards or attempt unauthorised repairs','Report defects, incidents and near misses immediately','Follow emergency procedures and instructor directions'])+'<div class="notice">Technical limits, operating sequences, maintenance instructions and emergency interventions must come from the relevant verified manufacturer and approved course documentation.</div>')+page('04 / APPLICATION','Practical learning preparation','<h3>Instructor-led activity</h3><p>'+esc(detail[2])+'.</p><p>Observe only under competent supervision. Record what you learned, not unverified operating instructions.</p><h3>Observation worksheet</h3><p>Activity / location:</p><div class="line"></div><p>Hazards identified:</p><div class="answer"></div><p>Controls explained by instructor:</p><div class="answer"></div><p>Questions for next session:</p><div class="answer"></div>')+page('05 / REVISION','Check your understanding','<p>Write short answers and review them with an instructor.</p>'+['What is the purpose of '+course+' training?','Identify three important components, tools or concepts.','List five potential workplace hazards.','How should defects or unsafe conditions be reported?','Why is the manufacturer or approved course manual essential?','What should you verify before taking part in practical training?'].map((q,i)=>'<h3>'+(i+1)+'. '+esc(q)+'</h3><div class="answer"></div>').join(''))+page('06 / STUDENT RECORD','Notes and next steps','<h3>Learning progress</h3><p>Student name: __________________________________</p><p>Instructor: _____________________________________</p><p>Training date: __________________________________</p><h3>Key notes</h3><div class="answer"></div><div class="answer"></div><h3>Next actions</h3>'+list(['Request the current official course outline','Confirm entry requirements, fees and assessment arrangements','Use approved course materials and manufacturer instructions','Discuss any uncertainty with the training provider'])+'<p class="small">Admissions: 071 801 0408 • info@newtons4th.co.za • newtons4th-academy.pages.dev/resources</p>')+page('07 / LESSON','Lesson 1: Workplace language','<p class="lead">Learn to communicate clearly before entering a practical environment.</p><h3>Lesson notes</h3>'+list(['Identify your supervisor, assessor and safety representative','Explain the difference between a hazard, risk and control','Use clear terminology when reporting a defect or near miss','Confirm instructions rather than guessing when unsure'])+'<h3>Illustration: hazard-to-control thinking</h3>'+flow('HAZARD','ASSESS RISK','CONTROL','REPORT')+'<h3>Class activity</h3><p>Describe one workplace hazard relevant to '+esc(course)+' and propose a suitable control. Have your instructor review your reasoning.</p><div class="answer"></div>')+page('08 / LESSON','Lesson 2: Components and systems','<p class="lead">Build a vocabulary of tools, parts and work processes.</p><h3>Study focus</h3><p>'+esc(detail[0])+'.</p>'+flow('IDENTIFY','PURPOSE','CHECK','DISCUSS')+'<h3>Guided learning</h3>'+list(['Identify the main parts or process stages using an approved diagram','Describe the purpose of each item in plain language','Ask what a normal condition looks like and how defects are reported','Discuss how the system interacts with people and the environment'])+'<h3>Activity: component glossary</h3><div class="answer"></div><div class="answer"></div>')+page('09 / LESSON','Lesson 3: Risk assessment','<p class="lead">Recognise that safe work starts before the task.</p>'+flow('OBSERVE','IDENTIFY','CONTROL','REVIEW')+'<h3>Common risk categories</h3>'+list(['People and traffic movement','Equipment condition and stored energy','Ground, weather and environmental conditions','Communication and visibility','Competence, authorisation and emergency readiness'])+'<h3>Case study</h3><p>A learner notices a damaged guard or barrier before a practical activity. What should happen next, who should be informed and why should the task not proceed until the risk is addressed?</p><div class="answer"></div>')+page('10 / LESSON','Lesson 4: Inspections and records','<p class="lead">Understand the purpose of inspections without attempting unauthorised maintenance.</p><h3>Inspection principles</h3>'+list(['Use the correct, current checklist for the equipment or workplace','Inspect only within your competence and authority','Identify and record observable damage, leaks, wear or missing safety items','Follow the defect-reporting and isolation process','Never return defective equipment to service without authorised clearance'])+'<h3>Illustration: defect reporting pathway</h3>'+flow('NOTICE','STOP / SECURE','REPORT','VERIFY')+'<h3>Practice worksheet</h3><p>What information should appear on a defect report?</p><div class="answer"></div>')+page('11 / LESSON','Lesson 5: People and communication','<p class="lead">Workplace safety depends on shared understanding.</p><h3>Discussion topics</h3>'+list(['Site induction and roles','Verbal instructions, radio etiquette and hand signals where applicable','Blind spots, restricted areas and separation from moving equipment','Stop-work authority and escalation of concerns','Emergency contact and muster-point awareness'])+'<h3>Illustration: communication loop</h3>'+flow('INSTRUCT','REPEAT BACK','CONFIRM','ACT')+'<h3>Scenario</h3><p>Two workers interpret a task instruction differently. Explain how to resolve the misunderstanding before any work starts.</p><div class="answer"></div>')+page('12 / LESSON','Lesson 6: Quality and responsibility','<p class="lead">Connect safe practice to quality, reliability and professionalism.</p><h3>Key concepts</h3>'+list(['Follow approved specifications and task instructions','Use appropriate tools and records','Check work against agreed quality criteria','Protect people, equipment and the environment','Reflect on feedback and plan improvement'])+'<h3>Activity</h3><p>Write a short example of how poor communication could affect both safety and quality in '+esc(course)+'.</p><div class="answer"></div><h3>Learning reflection</h3><div class="answer"></div>')+page('13 / PRACTICE','Case studies and applied thinking','<h3>Scenario A: Unsafe condition</h3><p>A safety-critical item appears damaged. The work team is under time pressure. What should you do and what must be documented?</p><div class="answer"></div><h3>Scenario B: Unclear instruction</h3><p>You are asked to complete a task outside your current training. How do you respond professionally?</p><div class="answer"></div><h3>Scenario C: Near miss</h3><p>A near miss occurs without injury. Why should it still be reported and investigated?</p><div class="answer"></div>')+page('14 / ASSESSMENT','Knowledge review and study plan','<h3>Self-check questions</h3>'+list(['Define hazard and risk, with a course-related example','Name three key parts, tools or process stages','Describe the correct response to an unsafe condition','Explain why an approved checklist is important','Identify two ways to improve workplace communication','Explain the role of competent supervision'])+'<h3>Personal study plan</h3><p>Topics I understand:</p><div class="answer"></div><p>Topics requiring instructor support:</p><div class="answer"></div><p>Next review date: _______________________</p>')+page('15 / TEACHING UNIT','Understand the subject','<p class="lead">Course-specific lesson: '+esc(course)+'</p><h3>Read and discuss</h3><p>'+esc(lesson[0])+'</p><h3>Key ideas</h3>'+list([detail[0],detail[1],'Use the relevant official diagrams and current instructor-approved learning materials'])+'<h3>Check for understanding</h3><p>Explain the subject in three sentences without copying the paragraph.</p><div class="answer"></div><h3>Instructor prompt</h3><p>Ask the learner to distinguish what the equipment or process does from how it is operated. Correct misconceptions before practical learning.</p>')+page('16 / GUIDED LESSON','Work through an example','<p class="lead">Demonstration and guided practice</p><h3>Learning task</h3><p>'+esc(lesson[1])+'</p><h3>Teaching sequence</h3>'+list(['Activate prior knowledge: ask learners what they already recognise','Model the concept with a verified drawing or non-operational classroom example','Invite learners to explain the concept in their own words','Correct misconceptions and connect the concept to workplace safety','Ask learners to document what they learned'])+'<h3>Student worksheet</h3><p>My explanation:</p><div class="answer"></div><p>What I still need to ask:</p><div class="answer"></div>')+page('17 / APPLIED LEARNING','Think like a professional','<h3>Case study</h3><p>'+esc(lesson[2])+'</p><h3>Guided questions</h3>'+list(['What facts do you know?','What additional information is missing?','Which hazards, controls or quality considerations matter?','Who should be consulted before proceeding?','How would you document the outcome?'])+'<h3>Your response</h3><div class="answer"></div><div class="answer"></div><h3>Instructor discussion</h3><p>Compare responses with the approved procedures for this programme. Do not use the case study as permission to perform a hazardous task.</p>')+page('18 / FEEDBACK','Model answer and reflection','<h3>Suggested reasoning for the case study</h3><div class="notice">'+esc(lesson[3])+'</div><p>This is a learning discussion point, not an operating instruction or official assessment answer.</p><h3>Reflection prompts</h3>'+list(['Which part of your answer was supported by evidence?','What assumptions did you make?','Which approved manual or standard should you consult?','How would you improve your explanation after feedback?'])+'<h3>Instructor feedback</h3><div class="answer"></div><p>Student signature: __________________ Date: ______________</p>');</script></body></html>
