<!doctype html><html lang="en-ZA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Course-specific introductory student handbooks and revision worksheets."><title>Student handbook | Newton's 4th Training Academy</title><style>:root{--navy:#172433;--gold:#ffc52a}*{box-sizing:border-box}body{margin:0;background:#e9eef2;color:#233244;font:15px/1.65 Arial,sans-serif}.toolbar{background:#101b28;color:white;display:flex;justify-content:space-between;align-items:center;gap:15px;padding:12px 5%;position:sticky;top:0;z-index:5}.toolbar button{background:var(--gold);border:0;border-radius:6px;padding:12px 17px;font-weight:800;cursor:pointer}.book{max-width:900px;margin:24px auto;background:#fff;box-shadow:0 14px 45px #101b2820}.page{min-height:950px;padding:60px 65px;border-bottom:1px solid #e0e6ec;break-after:page}.cover{background:linear-gradient(135deg,#111c2b,#304a61);color:#fff;display:flex;flex-direction:column;justify-content:space-between}.brand{font-weight:900;letter-spacing:2px}.brand span{color:var(--gold)}.kicker{font-size:12px;font-weight:800;letter-spacing:2px;color:#966c00;text-transform:uppercase}.cover .kicker{color:var(--gold)}h1{font-size:clamp(48px,7vw,78px);line-height:1.06;margin:20px 0}h2{font-size:36px;line-height:1.15;color:var(--navy);margin:15px 0 22px}h3{font-size:20px;color:var(--navy);margin:22px 0 8px}.cover h1 em{color:var(--gold);font-style:normal}.lead{font-size:19px}.cover .shape{height:200px;border:3px solid #ffffff45;background:repeating-linear-gradient(135deg,#ffffff08 0 15px,#ffc52a18 15px 30px);display:flex;align-items:center;justify-content:center}.cover .shape svg{width:80%;max-width:400px}.tag{display:inline-block;background:#ffc52a;color:#172433;padding:8px 13px;font-weight:800;font-size:12px}.notice{background:#fff7df;border-left:5px solid var(--gold);padding:17px 20px;margin:20px 0}.columns{display:grid;grid-template-columns:1fr 1fr;gap:25px}.panel{background:#f0f4f6;padding:20px;border-top:4px solid var(--gold)}li{margin:9px 0}.answer{min-height:105px;border:1px solid #d4dce2;border-radius:5px;margin:12px 0;padding:12px}.line{border-bottom:1px solid #d7e0e6;min-height:36px}.small{font-size:12px;color:#647080}.footer{border-top:1px solid #d7dfe5;padding-top:15px;margin-top:35px;font-size:12px;color:#657281}.diagram{width:100%;height:auto;margin:12px 0}a{color:#172433}@media(max-width:650px){.page{padding:30px 22px;min-height:0}.columns{grid-template-columns:1fr}.book{margin:0}.toolbar{font-size:12px}h2{font-size:30px}}@media print{@page{size:A4;margin:0}body{background:white;-webkit-print-color-adjust:exact;print-color-adjust:exact}.toolbar{display:none}.book{max-width:none;margin:0;box-shadow:none}.page{height:297mm;min-height:0;padding:18mm;overflow:hidden;break-after:page;page-break-after:always}.page:last-child{break-after:auto;page-break-after:auto}.cover .shape{height:62mm}}</style></head><body><div class="toolbar"><span>Newton's 4th • Student handbook</span><button onclick="window.print()">Print / Save PDF booklet</button></div><div class="book" id="book"></div><script>const data={"specific":{"Excavator":["Boom, stick, bucket, cab, tracks and hydraulic system","Ground stability, buried services, swing radius and nearby workers","Identify major components on a labelled diagram; explain the role of a banksman"],"TLB":["Loader bucket, backhoe boom, outriggers, tyres and hydraulic controls","Stability, underground services, pedestrian separation and reversing","Compare front-loader and backhoe functions; explain stabiliser purpose"],"Dump truck":["Body, tipping mechanism, tyres, braking system and mirrors","Overhead obstructions, uneven tipping surfaces and blind spots","Describe a safe haul-route briefing and defect reporting"],"Rigid dump truck":["Haul body, suspension, braking and retarder systems","Grades, heavy loads, visibility and haul-road intersections","Explain why manufacturer payload ratings and haul-road rules matter"],"Bulldozer":["Blade, tracks, ripper and operator protection","Slope stability, buried services and restricted visibility","Explain how terrain and ground conditions affect risk"],"Front-end loader":["Loader arms, bucket, articulation joint and tyres","Tipping risk, load visibility and people near the machine","Identify loading-zone hazards and safe communication principles"],"Grader":["Mouldboard, articulation, tyres and scarifier","Road edges, visibility, traffic interfaces and changing gradients","Explain why traffic management and ground assessment are required"],"Bobcat":["Skid-steer controls, lift arms, attachments and restraint systems","Crush points, attachment changes and rollover hazards","Identify attachment compatibility and exclusion-zone questions"],"Forklift":["Mast, forks, load backrest, counterweight and data plate","Unstable loads, pedestrians, blind corners and ramps","Explain the importance of the load chart and daily inspection"],"Drill rig":["Mast, drill string, feed mechanism and dust suppression","Moving rods, unstable ground, dust and stored energy","Identify dust-control and isolation questions"],"LHD scoop":["Bucket, articulation, operator compartment and braking systems","Confined mine headings, ventilation and poor visibility","Describe mine traffic separation and communication needs"],"Mobile crane":["Boom, outriggers, hook block and load chart","Ground bearing capacity, overhead lines and suspended loads","Interpret why a lift plan and competent rigging team are necessary"],"Tower crane":["Jib, counter-jib, hook, trolley and slew system","Wind, falling objects, communication and suspended loads","Identify site-specific lifting-plan requirements"],"Overhead crane":["Bridge, trolley, hoist, hook and pendant controls","Dropped loads, pinch points and exclusion zones","Explain pre-use inspection and signalling responsibilities"],"Welding and fabrication":["Welding process types, joints, drawings and PPE","Arc radiation, fumes, fire and electric shock","Identify ventilation and hot-work permit requirements"],"Electrical":["Circuits, isolation, earthing and test instruments","Electric shock, arc flash and unexpected energisation","Explain why isolation and competent testing are essential"],"Motor mechanics":["Engine systems, brakes, steering and diagnostic tools","Moving parts, lifting vehicles and hazardous fluids","Describe safe vehicle support and defect recording"],"First aid":["Primary survey, emergency response and reporting","Scene hazards, infection exposure and delayed emergency assistance","Outline the need to call emergency services and follow current accredited training"],"Firefighting":["Fire triangle, alarm systems and evacuation routes","Smoke, heat, toxic gases and unsafe re-entry","Explain evacuation priorities and when not to attempt firefighting"],"Business management":["Planning, operations, budgeting and customer value","Financial errors, weak controls and poor communication","Prepare a simple business process map"],"Information and communication technology":["Hardware, networks, cybersecurity and digital records","Phishing, data loss and privacy breaches","Create a password and backup awareness checklist"]},"cats":{"Earthmoving":["Site induction and ground assessment","Machine components and identification","Pre-use visual inspection concepts","Pedestrian separation and communication","Environmental awareness and shutdown reporting"],"Mining":["Mine induction and risk controls","Equipment components","Ventilation and dust awareness","Traffic management and exclusion zones","Emergency communication and reporting"],"Lifting":["Lifting equipment identification","Rated capacity and load stability","Signalling and pedestrian separation","Inspection and defect reporting","Lift planning and emergency controls"],"Artisan trades":["Tools and workshop terminology","Technical drawings and measurements","Materials and quality assurance","Workshop PPE and housekeeping","Defect reporting and practical supervision"],"Safety":["Hazard identification and risk assessment","Hierarchy of controls","Incident and near-miss reporting","Emergency response responsibilities","Safety documentation and communication"],"Business & ICT":["Professional communication","Workplace systems and records","Ethical and responsible practice","Quality assurance and problem-solving","Data security and continuous improvement"]}};const p=new URLSearchParams(location.search),course=(p.get('course')||'Course').slice(0,90),cat=(p.get('category')||'Earthmoving').slice(0,70);const topics=data.cats[cat]||data.cats.Earthmoving;const detail=data.specific[course]||[topics[1],topics[2], 'Explain key workplace concepts and discuss a supervised practical example with your instructor'];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const list=a=>'<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';const page=(k,title,body)=>'<section class="page"><div class="kicker">'+k+'</div><h2>'+title+'</h2>'+body+'<div class="footer">Newton\'s 4th Training Academy • Student learning support • '+esc(course)+'</div></section>';document.title=course+' | Student handbook';document.getElementById('book').innerHTML='<section class="page cover"><div><div class="brand">NEWTON\'S <span>4TH</span> TRAINING ACADEMY</div><p class="kicker">STUDENT HANDBOOK / INTRODUCTORY EDITION</p><h1>'+esc(course)+'<br><em>Study handbook</em></h1><p class="lead">'+esc(cat)+' • Theory, workplace awareness, revision and learning records</p></div><div class="shape"><svg viewBox="0 0 420 180" aria-label="Illustrated study pathway" role="img"><rect x="20" y="45" width="105" height="90" rx="8" fill="#ffc52a"/><path d="M40 65h65M40 85h65M40 105h40" stroke="#172433" stroke-width="7" stroke-linecap="round"/><path d="M140 90h80m-15-15 15 15-15 15" stroke="#ffc52a" stroke-width="7" fill="none"/><rect x="238" y="45" width="155" height="90" rx="8" fill="#ffffff25" stroke="#ffc52a" stroke-width="4"/><path d="M263 90l25 25 50-55" stroke="#ffc52a" stroke-width="10" fill="none"/></svg></div><div><span class="tag">SUPPLEMENTARY LEARNING RESOURCE</span><p>Prepared for independent study and instructor-led discussion. Not an equipment operating manual or accredited course textbook.</p></div></section>'+page('01 / INTRODUCTION','Your learning journey','<p class="lead">This handbook supports introductory learning for <strong>'+esc(course)+'</strong> in '+esc(cat)+'.</p><div class="notice"><strong>Safety and status:</strong> This is a supplementary learning resource. It does not authorise machine operation, electrical work, medical intervention, lifting, firefighting or any other hazardous activity. Follow the current approved curriculum, applicable law, manufacturer instructions and qualified supervision.</div><h3>Learning outcomes</h3>'+list(['Explain the purpose of the course and key terminology','Identify components, tools or processes relevant to the course','Recognise common hazards and workplace controls','Understand why inspections and defect reporting matter','Prepare questions for practical instruction and formal assessment'])+'<h3>How to use this booklet</h3><p>Read each section, write your own notes, discuss uncertainties with an instructor and complete the revision activities. Confirm the official course requirements and assessment standard with admissions.</p>')+page('02 / KNOWLEDGE','Core course concepts','<div class="columns"><div class="panel"><h3>Technical focus</h3><p>'+esc(detail[0])+'.</p><h3>Topics to discuss</h3>'+list(topics)+'</div><div><h3>Vocabulary notebook</h3><p>Define these terms using your instructor\'s approved learning materials.</p>'+topics.map(t=>'<p><strong>'+esc(t)+'</strong></p><div class="line"></div>').join('')+'</div></div>')+page('03 / SAFETY','Hazards and responsible practice','<h3>Course-specific hazard awareness</h3><p>'+esc(detail[1])+'.</p><h3>General safety principles</h3>'+list(['Attend site induction and follow relevant risk assessments','Use required PPE and comply with exclusion zones','Do not operate equipment or perform tasks without training and authorisation','Never bypass safeguards or attempt unauthorised repairs','Report defects, incidents and near misses immediately','Follow emergency procedures and instructor directions'])+'<div class="notice">Technical limits, operating sequences, maintenance instructions and emergency interventions must come from the relevant verified manufacturer and approved course documentation.</div>')+page('04 / APPLICATION','Practical learning preparation','<h3>Instructor-led activity</h3><p>'+esc(detail[2])+'.</p><p>Observe only under competent supervision. Record what you learned, not unverified operating instructions.</p><h3>Observation worksheet</h3><p>Activity / location:</p><div class="line"></div><p>Hazards identified:</p><div class="answer"></div><p>Controls explained by instructor:</p><div class="answer"></div><p>Questions for next session:</p><div class="answer"></div>')+page('05 / REVISION','Check your understanding','<p>Write short answers and review them with an instructor.</p>'+['What is the purpose of '+course+' training?','Identify three important components, tools or concepts.','List five potential workplace hazards.','How should defects or unsafe conditions be reported?','Why is the manufacturer or approved course manual essential?','What should you verify before taking part in practical training?'].map((q,i)=>'<h3>'+(i+1)+'. '+esc(q)+'</h3><div class="answer"></div>').join(''))+page('06 / STUDENT RECORD','Notes and next steps','<h3>Learning progress</h3><p>Student name: __________________________________</p><p>Instructor: _____________________________________</p><p>Training date: __________________________________</p><h3>Key notes</h3><div class="answer"></div><div class="answer"></div><h3>Next actions</h3>'+list(['Request the current official course outline','Confirm entry requirements, fees and assessment arrangements','Use approved course materials and manufacturer instructions','Discuss any uncertainty with the training provider'])+'<p class="small">Admissions: 071 801 0408 • info@newtons4th.co.za • newtons4th-academy.pages.dev/resources</p>');</script></body></html>
